<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finding Excuses!</title>
    <link rel="stylesheet" href="findexcuses.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>
<body>
    <header class="exhead">
        <h5>IronPulse Excuse Center</h5>
        <h1>Looking For <span class="txt-blue">Excuses?</span></h1>
         <p>Let's see if your's is any different </p>
    </header>
    <main class="excard">
        <h2>What's Stopping You Today? </h2>
        <div class="excuses">
            <div class="card">
                <p>I'm Too Tired</p>
            </div>
            <div class="card">
                <p>I'll Start Tommorow</p>
            </div>
            <div class="card">
                <p>No Time</p>
            </div>
            <div class="card">
                <p>Not Motivated</p>
            </div>
            <div class="card">
                <p>Gym Is Too Far!</p>
            </div>
            <div class="card">
                <p>It's Raining.</p>
            </div>
        </div>
        <div class="exresult">
            <h3>Analysis Complete</h3>
            <p id="reason">Select an excuse above.</p>
        </div>
    </main>

    <!-- <a href="index.html" id="join"><i class="fa-regular fa-circle-left"></i>Return To The Grind</a> -->
</body>

</html>
